name: CI

# Core quality gate for every PR and push to main.
# Runs lint, type-check, and build for apps/web (the only workspace today).
# Uses npm ci with cached ~/.npm + .next cache to keep runs fast.
#
# Free on public repos (unlimited Actions minutes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Next.js build needs a Payload secret; a dummy value is fine for build.
          PAYLOAD_SECRET: ci-build-secret-not-real
          DATABASE_URI: postgresql://ci:ci@localhost:5432/ci
