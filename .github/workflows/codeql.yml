name: CodeQL

# GitHub CodeQL security vulnerability scanning.
# Free for public repos.
# Runs on every PR + weekly schedule to catch new queries/rules.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan (Monday 03:00 UTC).
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (TypeScript/JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Only analyze the real app code; skip generated/vendored.
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
