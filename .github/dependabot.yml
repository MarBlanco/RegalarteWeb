# Dependabot ï¿½?" opens PRs for outdated / insecure dependencies.
# Free for all repos (public and private).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm app deps (apps/web)
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Majors bloqueados a propósito (ver el cierre de los PR #36, #40, #41, #42 y #43):
    #  - graphql 17: Payload 3.x exige graphql ^16.8.1.
    #  - tailwindcss 4: migración de configuración y de shadcn/ui; se hace como tarea propia.
    #  - typescript (raíz): el pin ~5.9 es el que usan typescript-eslint y Lexical (peer <6.1). apps/web usa TypeScript 7.
    #  - @types/node: debe coincidir con el runtime (Node 22), no saltar de major.
    # Los menores y parches siguen entrando por el grupo minor-and-patch.
    ignore:
      - dependency-name: 'graphql'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Group minor/patch updates to avoid one-PR-per-dependency noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - dependencies
      - devex

  # npm root deps
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Majors bloqueados a propósito (ver el cierre de los PR #36, #40, #41, #42 y #43):
    #  - graphql 17: Payload 3.x exige graphql ^16.8.1.
    #  - tailwindcss 4: migración de configuración y de shadcn/ui; se hace como tarea propia.
    #  - typescript (raíz): el pin ~5.9 es el que usan typescript-eslint y Lexical (peer <6.1). apps/web usa TypeScript 7.
    #  - @types/node: debe coincidir con el runtime (Node 22), no saltar de major.
    # Los menores y parches siguen entrando por el grupo minor-and-patch.
    ignore:
      - dependency-name: 'graphql'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - dependencies
      - devex

  # GitHub Actions ï¿½?" keep workflow actions on current versions.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    labels:
      - dependencies
      - devex
      - ci