# SonarCloud project configuration.
# Create this project on https://sonarcloud.io (sign in with GitHub),
# then edit sonar.organization + sonar.projectKey below to match the values
# SonarCloud shows you on the project's "Information" page.
#
# The SONAR_TOKEN secret must be added to the repo's GitHub Secrets.

sonar.organization = marblanco
sonar.projectKey = MarBlanco_RegalarteWeb

# Root of the analysis — entire repo.
sonar.projectName = RegalarteWeb
sonar.sourceEncoding = UTF-8

# Sources: the actual app code lives under apps/web/src.
sonar.sources = apps/web/src
sonar.tests = apps/web/src
sonar.test.inclusions = **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude generated/vendored code from analysis.
sonar.exclusions = \
  **/node_modules/**, \
  **/dist/**, \
  **/.next/**, \
  **/build/**, \
  apps/web/src/payload-types.ts, \
  apps/web/src/migrations/**, \
  apps/web/src/app/(payload)/**, \
  apps/web/src/app/api/**, \
  **/*.d.ts

# Coverage will be wired once a test runner is added (Sprint 11 — Hardening).
# sonar.javascript.lcov.reportPaths = apps/web/coverage/lcov.info
